name: Deploy to Staging (Automated on Develop)

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Preflight (lint & typecheck)
        run: npm run preflight

      - name: Tests
        run: npm test

      - name: Require Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Staging deploy cannot run. Missing GitHub environment secrets:$missing"
            exit 1
          fi

      - name: Deploy to Vercel (Staging)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx vercel build --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --token="$VERCEL_TOKEN"

      - name: Staging Health Verification
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "::error::Repository variable STAGING_URL is not set; cannot verify staging health."
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$STAGING_URL/api/health" -o /tmp/health.json; then
              cat /tmp/health.json; echo
              if grep -q '"status":"ok"' /tmp/health.json; then
                echo "Staging is healthy."
                exit 0
              fi
            fi
            echo "Attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          echo "::error::Staging health check failed after 5 attempts."
          exit 1
